<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>{{ item.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen py-10">
    <div class="max-w-xl mx-auto px-4">
        <a href="{% url 'catalog_list' %}" class="text-sm text-blue-600 hover:underline">&larr; 一覧に戻る</a>

        <div class="bg-white rounded-lg shadow p-6 mt-4 {% if item.is_soldout %}opacity-60{% endif %}">
            <h1 class="text-2xl font-bold mb-2">
                {{ item.name }}
                {% if item.is_soldout %}
                    <span class="ml-2 inline-block text-xs bg-red-600 text-white rounded px-2 py-0.5 align-middle">売り切れ</span>
                {% endif %}
            </h1>
            <p class="text-gray-600 whitespace-pre-line mb-6">{{ item.description }}</p>
            <p class="text-2xl font-bold mb-6">¥{{ item.price|floatformat:0 }}</p>

            <button
                type="button"
                {% if item.is_soldout %}disabled{% endif %}
                class="w-full py-3 rounded-lg font-semibold text-white {% if item.is_soldout %}bg-gray-400 cursor-not-allowed{% else %}bg-blue-600 hover:bg-blue-700{% endif %}"
            >
                {% if item.is_soldout %}売り切れ{% else %}カートに入れる{% endif %}
            </button>
        </div>
    </div>
</body>
</html>
