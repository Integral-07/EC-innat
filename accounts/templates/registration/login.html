<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
    <style>
        body {
            font-family: sans-serif;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-box {
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            width: 300px;
        }
        .login-box h1 {
            font-size: 1.25rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }
        .login-box p {
            margin-bottom: 1rem;
        }
        .login-box label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 0.25rem;
        }
        .login-box input {
            width: 100%;
            padding: 0.5rem;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .login-box button {
            width: 100%;
            padding: 0.6rem;
            margin-top: 0.5rem;
            border: none;
            border-radius: 4px;
            background: #333;
            color: #fff;
            cursor: pointer;
        }
        .errorlist {
            color: #c0392b;
            font-size: 0.85rem;
            list-style: none;
            padding: 0;
            margin: 0 0 1rem;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h1>ログイン</h1>
        <form method="post">
            {% csrf_token %}
            {{ form.non_field_errors }}
            {% for field in form %}
                <p>
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {{ field.errors }}
                </p>
            {% endfor %}
            <input type="hidden" name="next" value="{{ next }}">
            <button type="submit">ログイン</button>
        </form>
    </div>
</body>
</html>
